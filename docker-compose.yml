# cablemess. Settings in .env beside this file (from .env.example). Image built by deploy/to-*.sh.
name: cablemess
services:
  app:
    image: cablemess:local
    container_name: cablemess
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/London
    volumes:
      - ./data:/data
    # A web page? Publish one port: WOPR "192.168.1.21:31xx:8000", VPS "172.17.0.1:20xxx:8000" (bin/ports).
    # ports:
    #   - "192.168.1.21:3100:8000"
